ion}.match-card.selected{outline:3px solid #f4bd42;background:#fff8e4}.match-card.matched{border-color:#16845d}.match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}.match-svg line{stroke:#16845d;stroke-width:3;stroke-linecap:round}.match-board{min-height:180px}.match-help,.help{font-size:13px;color:#61778a;margin:8px 0 12px}.group-bank{border:2px dashed #cbdce8;border-radius:14px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #cbdce8;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;user-select:none;touch-action:manipulation}.chip.selected{background:#fff3d6;border-color:#d49a20}.group-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dropzone{border:1.5px solid #b9c9c6;border-radius:16px;min-height:125px;padding:12px;background:#fbfefd}.dropzone h4{margin:0 0 10px;color:var(--teal)}.dropzone .chip{display:inline-block;margin:3px}.order-list{display:flex;gap:9px;flex-wrap:wrap;padding:14px;background:#e1f3f0;border:1px solid #bdd7d2;border-radius:12px}.order-item{padding:10px 13px;background:white;border:1px dashed #c98f8f;border-radius:8px;cursor:grab;touch-action:manipulation;font-weight:800}.order-item.selected{background:#fff3d6;border-color:#d49a20}.result-score{font-size:36px;font-weight:1000;color:var(--teal)}.muted{color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){.game-layout{grid-template-columns:1fr}.side{order:2}.option-grid{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.match-board{gap:12px}.panel-body{padding:17px}.app{padding:14px 10px 30px}}@media(max-width:480px){.group-grid{grid-template-columns:1fr}.match-card{padding:10px 8px;font-size:14px}.nav-grid{grid-template-columns:repeat(6,1fr)}}

.image-option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch;margin:14px 0}
.image-option{position:relative;display:flex;align-items:center;justify-content:center;min-height:190px;padding:10px;background:#fbfdff;border:2px solid var(--line);border-radius:15px;cursor:pointer;transition:.18s ease}
.image-option:hover{border-color:#8fb7d4;transform:translateY(-2px)}
.image-option.selected{border-color:var(--blue);background:#edf7ff;box-shadow:0 0 0 3px rgba(23,105,170,.12)}
.image-option input{position:absolute;opacity:0;pointer-events:none}
.image-option img{display:block;width:100%;height:220px;object-fit:contain;border-radius:9px}
.inline-input{display:inline-block;vertical-align:baseline;width:112px;max-width:30vw;height:38px;margin:0 4px;padding:4px 7px;border:1.5px solid #8eb8d0;border-radius:8px;background:#fff;text-align:center;font-weight:800;color:var(--navy)}
.inline-input:focus{outline:3px solid rgba(23,105,170,.14);border-color:var(--blue)}
.match-image{display:block;max-width:100%;width:auto;height:112px;object-fit:contain;margin:auto;border-radius:8px}
.match-card{display:flex;align-items:center;justify-content:center;text-align:center;min-height:112px;padding:10px 12px;user-select:none}
.match-card[data-side="left"]{touch-action:none}
.match-col{gap:12px}
.match-svg line{stroke:#13877d;stroke-width:3.2;stroke-linecap:round}
.match-svg .temp-line{stroke:#e49a17;stroke-dasharray:7 5;stroke-width:3}
.dropzone{transition:background .15s,border-color .15s}
.dropzone:has(.chip.selected){border-color:#d49a20;background:#fffaf0}
.group-bank{min-height:64px}
@media(max-width:650px){.image-option-grid{grid-template-columns:1fr}.image-option{min-height:145px}.image-option img{height:180px}.match-board{gap:10px}.match-image{height:90px}.match-card{min-height:96px;padding:8px 5px}.inline-input{width:90px;height:35px}}

/* ===== Tối ưu khả năng đọc cho học sinh lớp 1 ===== */
body{font-size:19px;line-height:1.55}
.app{max-width:1360px;padding:26px 22px 48px}
.hero{margin:12px 0 28px}
.hero h1{font-size:clamp(29px,4.2vw,46px);line-height:1.25}

.q-number{font-size:20px;padding:9px 15px}
.question-heading .muted{font-size:18px}

/* ===== Bổ sung tương tác kéo thả từ vào chỗ trống cho Câu 30 ===== */
.dragfill-list{display:grid;gap:13px;margin:14px 0}
.dragfill-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:21px;line-height:1.5}
.dragfill-slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:48px;padding:5px 10px;border:2px dashed #9bbbc7;border-radius:10px;background:#f7fcfc;color:var(--navy);font-weight:800}
.dragfill-slot.filled{border-style:solid;border-color:var(--teal);background:#e8f7f3}
.dragfill-bank{display:flex;gap:9px;flex-wrap:wrap;padding:14px;background:#e1f3f0;border:1px solid #bdd7d2;border-radius:12px;margin-top:14px}
.dragfill-chip{padding:9px 14px;background:#fff;border:1px dashed #c98f8f;border-radius:8px;cursor:grab;touch-action:manipulation;font-weight:800}
.dragfill-chip.selected{background:#fff3d6;border-color:#d49a20}
@media(max-width:650px){.dragfill-row{font-size:19px}.dragfill-slot{min-width:100px;min-height:44px}.dragfill-chip{font-size:18px;padding:9px 12px}}

<body>
<div class="app">
  <header class="hero">
    <h1>TRẠNG NGUYÊN TIẾNG VIỆT LỚP 1</h1>
    <div class="sub">CHỦ ĐIỂM 1 • MỞ RỘNG VỐN TỪ</div>
  </header>
  <section id="startScreen" class="panel start-panel">
    <div class="panel-head"><h2>🎮 Sẵn sàng chinh phục thử thách?</h2></div>
    <div class="panel-body">
      <div class="settings">
        <label class="setting">Trộn thứ tự câu hỏi <input id="shuffleQuestions" type="checkbox"></label>
        <label class="setting">Trộn đáp án <input id="shuffleAnswers" type="checkbox" checked></label>
        <label class="setting">Âm thanh <input id="soundOn" type="checkbox" checked></label>
        <label class="setting">Thời gian làm bài: 30 phút <input id="timerOn" type="checkbox" checked></label>
      </div>
      <p class="help">Bài thi gồm 38 câu, mỗi câu tối đa 10 điểm. Tổng điểm: 380.</p>
      <p class="help">Các câu nối cặp được chấm điểm theo số cặp nối đúng trên tổng số cặp.</p>
      <div class="action-row">
        <button class="btn primary" onclick="startGame(false)">🎮 BẮT ĐẦU LÀM BÀI</button>
        <button class="btn secondary" onclick="startGame(true)">📖 LÀM THEO THỨ TỰ ĐỀ</button>
      </div>
    </div>
  </section>
  <section id="gameScreen" hidden>
    <div class="game-layout">
      <aside class="panel side">
        <div>Tiến độ: <b id="progressText">0/38</b></div>
        <div class="progress"><i id="progressBar"></i></div>
        <p class="help" id="timerLabel">Thời gian còn lại: <b id="timer">30:00</b></p>
        <div class="nav-grid" id="navGrid"></div>
        <div class="action-row"><button class="btn secondary" onclick="submitGame()">NỘP BÀI</button></div>
      </aside>
      <main class="panel main">
        <div id="questionContent"></div>
        <div id="feedback"></div>
        <div class="question-actions">
          <button id="prevBtn" class="btn secondary" onclick="move(-1)">← CÂU TRƯỚC</button>
          <button id="checkBtn" class="btn primary" onclick="checkAnswer()">✓ KIỂM TRA ĐÁP ÁN</button>
          <button id="nextBtn" class="btn secondary" onclick="move(1)">CÂU TIẾP THEO →</button>
        </div>
      </main>
    </div>
  </section>
  <section id="resultScreen" class="panel" hidden>
    <div class="panel-head"><h2>🏆 KẾT QUẢ BÀI LÀM</h2></div>
    <div class="panel-body" id="resultBody"></div>
  </section>
</div>
<script>
const QUESTIONS=[{"id":1,"type":"mcq","prompt":"Từ nào là từ chỉ đồ dùng trong gia đình?","options":[["A","cháo rán"],["B","bảng đen"],["C","máy bay"],["D","tàu hoả"]],"correct":"A"},{"id":2,"type":"mcq","prompt":"Từ nào là từ chỉ phương tiện giao thông?","options":[["A","cuốn vở"],["B","máy tính"],["C","tàu hoả"],["D","bình nước"]],"correct":"C"},{"id":3,"type":"mcq","prompt":"Từ nào không cùng nhóm nghĩa với các từ còn lại?","options":[["A","cà rốt"],["B","bí ngô"],["C","bắp cải"],["D","khăn len"]],"correct":"D"},{"id":4,"type":"mcq","prompt":"Tiếng nào ghép với tiếng \"trí\" để tạo thành từ?","options":[["A","ăn"],["B","đi"],["C","tuệ"],["D","khen"]],"correct":"C"},{"id":5,"type":"mcq","prompt":"Tiếng nào ghép với tiếng \"dừa\" để tạo thành từ?","options":[["A","khen"],["B","xiêm"],["C","múa"],["D","bay"]],"correct":"B"},{"id":6,"type":"mcq","prompt":"Từ nào không cùng nhóm nghĩa với các từ còn lại?","options":[["A","sách vở"],["B","máy bay"],["C","tàu hoả"],["D","xe đạp"]],"correct":"A"},{"id":7,"type":"mcq","prompt":"Từ nào khác với các từ còn lại?","options":[["A","nhà gỗ"],["B","nhà tầng"],["C","nhà văn"],["D","nhà sàn"]],"correct":"C"},{"id":8,"type":"mcq","prompt":"Đâu là tên một phương tiện?","options":[["A","phá"],["B","phà"],["C","pha"],["D","phá"]],"correct":"B"},{"id":9,"type":"mcq","prompt":"Từ nào khác với các từ còn lại?","options":[["A","cá chép"],["B","cá trắm"],["C","cá nhân"],["D","cá bóng"]],"correct":"C"},{"id":10,"type":"mcq","prompt":"Từ nào khác với các từ còn lại?","options":[["A","anh trai"],["B","em gái"],["C","thầy giáo"],["D","ông nội"]],"correct":"C"},{"id":11,"type":"mcq","prompt":"Tiếng \"can\" ghép với tiếng nào để tạo thành từ?","options":[["A","tám"],["B","đảm"],["C","chạm"],["D","giảm"]],"correct":"B"},{"id":12,"type":"mcq","prompt":"Đâu là tên một đồ vật?","options":[["A","bàn tán"],["B","bàn thắng"],["C","bàn là"],["D","bàn chân"]],"correct":"C"},{"id":13,"type":"mcq","prompt":"Từ nào khác với từ còn lại?","options":[["A","ngôi trường"],["B","mái trường"],["C","trường học"],["D","đồng ruộng"]],"correct":"D"},{"id":14,"type":"mcq","prompt":"Từ nào khác với các từ còn lại?","options":[["A","con sóc"],["B","con mắt"],["C","con vẹt"],["D","con ốc"]],"correct":"B"},{"id":15,"type":"mcq","prompt":"Từ nào khác với các từ còn lại?","options":[["A","con vịt"],["B","con trâu"],["C","con mèo"],["D","em bé"]],"correct":"D"},{"id":16,"type":"mcq","prompt":"Từ nào khác với các từ còn lại?","options":[["A","thước kẻ"],["B","bút chì"],["C","quyển sách"],["D","xe buýt"]],"correct":"D"},{"id":17,"type":"mcq","prompt":"Từ nào dưới đây khác với từ còn lại?","options":[["A","con gà"],["B","con lợn"],["C","con tem"],["D","con cá"]],"correct":"C"},{"id":18,"type":"mcq","prompt":"Tiếng \"công\" ghép với tiếng nào để tạo thành từ?","options":[["A","làn"],["B","san"],["C","an"],["D","màn"]],"correct":"C"},{"id":19,"type":"mcq","prompt":"Trong các từ sau, từ nào chỉ con vật sống được dưới nước?","options":[["A","chim sơn ca"],["B","chim cánh cụt"],["C","chim bồ câu"],["D","chim chiền chiện"]],"correct":"B"},{"id":20,"type":"mcq","prompt":"Từ nào dưới đây có nghĩa khác biệt so với các từ còn lại?","options":[["A","quả táo"],["B","quả bóng"],["C","quả cam"],["D","quả chuối"]],"correct":"B"},{"id":21,"type":"match","prompt":"Em hãy nối các từ ở cột bên trái với nhóm tương ứng ở cột bên phải.","left":[["left_objects","bàn, phấn, bảng"],["left_people","giáo viên, học sinh, bảo vệ"],["left_activities","giảng dạy, học bài, tập thể dục"]],"right":[["right_people","Người trong trường học"],["right_activities","Hoạt động trong trường học"],["right_objects","Đồ vật trong trường học"]],"correct":{"left_objects":"right_objects","left_people":"right_people","left_activities":"right_activities"}},{"id":22,"type":"mcq","prompt":"Ngược với sáng gọi là gì?","options":[["A","trong"],["B","trắng"],["C","tối"],["D","soi"]],"correct":"C"},{"id":23,"type":"mcq","prompt":"Ngược với “nóng” là gì?","options":[["A","bóng"],["B","mưa"],["C","lạnh"],["D","nắng"]],"correct":"C"},{"id":24,"type":"mcq","prompt":"Ngược với “cũ” là gì?","options":[["A","xấu"],["B","mới"],["C","lâu"],["D","đẹp"]],"correct":"B"},{"id":25,"type":"mcq","prompt":"Ngược với “vắng” là gì?","options":[["A","ít"],["B","thưa"],["C","đông"],["D","gần"]],"correct":"C"},{"id":26,"type":"mcq","prompt":"Ngược với “xấu” gọi là gì?","options":[["A","đen"],["B","tốt"],["C","tươi"],["D","dữ"]],"correct":"B"},{"id":27,"type":"mcq","prompt":"Những chiến sĩ bảo vệ tổ quốc còn được gọi là gì?","options":[["A","giáo viên"],["B","kĩ sư"],["C","bộ đội"],["D","cầu thủ"]],"correct":"C"},{"id":28,"type":"mcq","prompt":"Từ nào dưới đây không chỉ màu sắc ?","options":[["A","đỏ rực"],["B","lúa gạo"],["C","tím ngắt"],["D","vàng tươi"]],"correct":"B"},{"id":29,"type":"mcq","prompt":"Từ nào dưới đây không chỉ con vật ?","options":[["A","con ong"],["B","con gà"],["C","con chim"],["D","con tàu"]],"correct":"D"},{"id":30,"type":"mcq","prompt":"Người sáng tác thơ ca được gọi là gì?","options":[["A","thầy giáo"],["B","nhà thơ"],["C","nhà giáo"],["D","công an"]],"correct":"B"},{"id":31,"type":"mcq","prompt":"Trong các từ sau, từ nào chỉ con vật sống trong rừng?","options":[["A","hổ"],["B","trâu"],["C","ngan"],["D","vịt"]],"correct":"A"},{"id":32,"type":"mcq","prompt":"Chọn từ phù hợp đứng trước cụm từ “làm việc trong nhà máy.” để hoàn thành câu có nghĩa?","options":[["A","Chú công an"],["B","Cô giáo em"],["C","Bác thợ nề"],["D","Anh công nhân"]],"correct":"D"},{"id":33,"type":"mcq","prompt":"Cụm từ nào dưới đây có thể ghép với cụm từ “Trường học” để được câu có nghĩa phù hợp?","options":[["A","rất hạnh phúc"],["B","là học sinh lớp 1"],["C","nước trong xanh"],["D","là ngôi nhà thứ hai"]],"correct":"D"},{"id":34,"type":"mcq","prompt":"Cụm từ nào dưới đây có thể ghép với từ “cô giáo” để được câu có nghĩa phù hợp?","options":[["A","rất đông vui"],["B","như mẹ hiền"],["C","trời quang đãng"],["D","đang học mầm non"]],"correct":"B"},{"id":35,"type":"mcq","prompt":"Câu văn nào viết về tình cảm bạn bè?","options":[["A","Giờ tan trường, cổng trường tấp nập xe cộ."],["B","Bạn Nam là bạn thân nhất của em."],["C","Nam đã là học sinh lớp Một."],["D","Tan học, các bạn nhỏ chăm chỉ dọn dẹp vệ sinh."]],"correct":"B"},{"id":36,"type":"mcq","prompt":"Câu nào viết về gia đình?","options":[["A","Sáng mai, lớp em có buổi đi dã ngoại."],["B","Buổi tối, cả nhà em cùng nhau ngồi xem phim."],["C","Nam xuất sắc giành giải nhất trong cuộc thi Toán."],["D","Cây bàng xoè tán như chiếc ô khổng lồ."]],"correct":"B"},{"id":37,"type":"match","prompt":"Em hãy nối các tiếng ở cột bên trái với các tiếng ở cột bên phải để tạo thành từ đúng:","left":[["tung","tưng"],["buc","bức"],["khu","khu"],["do","đỏ"],["thuc","thực"]],"right":[["rung","rừng"],["bung","bừng"],["pham","phẩm"],["ruc","rực"],["tranh","tranh"]],"correct":{"tung":"bung","buc":"tranh","khu":"rung","do":"ruc","thuc":"pham"}},{"id":38,"type":"match","prompt":"Em hãy nối các tiếng ở cột bên trái với các tiếng ở cột bên phải để tạo thành từ đúng:","left":[["luoi","lưỡi"],["chau","chậu"],["con","con"],["dau","đậu"]],"right":[["dua","đũa"],["chau_word","cháu"],["cau","câu"],["thau","thau"]],"correct":{"luoi":"cau","chau":"thau","con":"chau_word","dau":"dua"}}];
const TOTAL_QUESTIONS=QUESTIONS.length;
const TOTAL_POINTS=TOTAL_QUESTIONS*10;
let state={idx:0,order:[],answers:{},shuffle:false,remaining:1800,elapsed:0,timer:null,selected:null,studentName:'',timerEnabled:true};
let matchDrag=null;
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').normalize('NFC').trim().toLocaleLowerCase('vi').replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffleArray=arr=>[...arr].sort(()=>Math.random()-.5);
const pointsText=n=>Number(n).toFixed(1).replace(/\.0$/,'');
function A(q){return state.answers[q.id]||(state.answers[q.id]={});}
function current(){return QUESTIONS.find(q=>q.id===state.order[state.idx]);}
function formatTime(seconds){const s=Math.max(0,Math.floor(seconds));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function elapsedSeconds(){return state.timerEnabled?1800-state.remaining:state.elapsed;}
let audioContext=null;
function playCheckSound(isCorrect){
  if(!$('soundOn').checked)return;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  try{
    audioContext=audioContext||new AudioContextClass();
    if(audioContext.state==='suspended')audioContext.resume();
    const now=audioContext.currentTime;
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    oscillator.type='sine';
    oscillator.frequency.setValueAtTime(isCorrect?880:260,now);
    if(isCorrect)oscillator.frequency.setValueAtTime(1175,now+0.10);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.10,now+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.25);
    oscillator.connect(gain);gain.connect(audioContext.destination);
    oscillator.start(now);oscillator.stop(now+0.26);
  }catch(error){/* Âm thanh không khả dụng thì trò chơi vẫn tiếp tục bình thường. */}
}
function startGame(ordered){
  state.studentName='';
  state.shuffle=$('shuffleAnswers').checked;
  state.timerEnabled=$('timerOn').checked;
  state.order=QUESTIONS.map(q=>q.id);
  if(!ordered&&$('shuffleQuestions').checked)state.order=shuffleArray(state.order);
  QUESTIONS.forEach(q=>{
    delete q._opts;delete q._right;
    if(state.shuffle){
      if(q.options)q._opts=shuffleArray(q.options);
      if(q.right)q._right=shuffleArray(q.right);
    }
  });
  state.idx=0;state.answers={};state.selected=null;state.remaining=state.timerEnabled?1800:0;state.elapsed=0;
  $('timerLabel').firstChild.textContent=state.timerEnabled?'Thời gian còn lại: ':'Thời gian làm bài: ';
  $('timer').textContent=state.timerEnabled?'30:00':'00:00';
  $('startScreen').hidden=true;$('gameScreen').hidden=false;
  render();tick();
}
function tick(){
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    if(state.timerEnabled){
      state.remaining--;
      $('timer').textContent=formatTime(state.remaining);
      if(state.remaining<=0){clearInterval(state.timer);submitGame(true);}
    }else{
      state.elapsed++;
      $('timer').textContent=formatTime(state.elapsed);
    }
  },1000);
}
function render(){
  const q=current(),a=A(q);
  const checkedCount=Object.values(state.answers).filter(x=>x.checked).length;
  $('progressText').textContent=checkedCount+'/'+TOTAL_QUESTIONS;
  $('progressBar').style.width=((state.idx+1)/TOTAL_QUESTIONS*100)+'%';
  $('navGrid').innerHTML=state.order.map((id,i)=>`<button class="${i===state.idx?'active':''} ${state.answers[id]?.checked?'done':''}" onclick="go(${i})">${id}</button>`).join('');
  let h=`<div class="question-heading"><span class="q-number">CÂU ${q.id} / ${TOTAL_QUESTIONS}</span><span class="muted">10 điểm</span></div><div class="question-prompt">${esc(q.prompt)}</div>`;
  if(q.type==='mcq'){
    const opts=q._opts||q.options;
    h+=`<div class="option-grid">${opts.map(([id,t])=>`<label class="option ${a.choice===id?'selected':''}"><input type="radio" name="q${q.id}" value="${id}" ${a.choice===id?'checked':''} ${a.checked?'disabled':''} onchange="choose('${id}')"><span class="option-letter">${id}.</span><span>${esc(t)}</span></label>`).join('')}</div>`;
  }
  if(q.type==='match'){
    const right=q._right||q.right;
    h+=`<div class="match-help">Kéo từ cạnh ô bên trái sang ô tương ứng bên phải để nối. Em cũng có thể chạm ô bên trái rồi chạm ô bên phải. Muốn đổi, hãy nối lại.</div>
    <div class="match-board" id="matchBoard"><div class="match-col">${q.left.map(([id,t])=>`<div class="match-card ${a.matches?.[id]?'matched':''} ${state.selected===id?'selected':''}" data-side="left" data-id="${id}" onpointerdown="beginMatchDrag(event,'${id}')" onclick="pickLeft('${id}')">${esc(t)}</div>`).join('')}</div>
    <svg class="match-svg" id="matchSvg" aria-hidden="true"></svg>
    <div class="match-col">${right.map(([id,t])=>`<div class="match-card ${Object.values(a.matches||{}).includes(id)?'matched':''}" data-side="right" data-id="${id}" onclick="pickRight('${id}')">${esc(t)}</div>`).join('')}</div></div>
    <div class="help">Đã nối: ${Object.keys(a.matches||{}).length}/${q.left.length}</div>`;
  }
  $('questionContent').innerHTML=h;
  $('feedback').innerHTML=a.checked?feedback(q):'';
  $('checkBtn').disabled=!!a.checked;$('checkBtn').textContent=a.checked?'ĐÃ KIỂM TRA':'✓ KIỂM TRA ĐÁP ÁN';
  $('prevBtn').disabled=state.idx===0;$('nextBtn').disabled=state.idx===state.order.length-1;
  if(q.type==='match')requestAnimationFrame(()=>drawLines(q));
}
function choose(id){let a=A(current());if(a.checked)return;a.choice=id;render();}
function pickLeft(id){if(A(current()).checked)return;state.selected=id;render();}
function pickRight(id){let q=current(),a=A(q);if(a.checked||!state.selected)return;connectMatch(state.selected,id);}
function connectMatch(leftId,rightId){
  let q=current(),a=A(q);if(a.checked)return;
  a.matches=a.matches||{};
  for(const k in a.matches)if(k===leftId||a.matches[k]===rightId)delete a.matches[k];
  a.matches[leftId]=rightId;state.selected=null;matchDrag=null;render();
}
function beginMatchDrag(e,id){if(A(current()).checked)return;matchDrag={id};state.selected=id;}
function drawLines(q){
  const svg=$('matchSvg'),board=$('matchBoard');if(!svg||!board)return;
  const b=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);svg.innerHTML='';
  const left=board.querySelectorAll('.match-card[data-side="left"]'),right=board.querySelectorAll('.match-card[data-side="right"]');
  const a=A(q);
  Object.entries(a.matches||{}).forEach(([lid,rid])=>{
    const l=[...left].find(el=>el.dataset.id===lid),r=[...right].find(el=>el.dataset.id===rid);if(!l||!r)return;
    const lr=l.getBoundingClientRect(),rr=r.getBoundingClientRect();
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',lr.right-b.left);line.setAttribute('y1',lr.top+lr.height/2-b.top);
    line.setAttribute('x2',rr.left-b.left);line.setAttribute('y2',rr.top+rr.height/2-b.top);svg.appendChild(line);
  });
}
function drawTempLine(x,y){
  if(!matchDrag)return;const svg=$('matchSvg'),board=$('matchBoard');if(!svg||!board)return;
  const card=board.querySelector(`.match-card[data-side="left"][data-id="${matchDrag.id}"]`);if(!card)return;
  const b=board.getBoundingClientRect(),r=card.getBoundingClientRect();
  let line=svg.querySelector('.temp-line');if(!line){line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','temp-line');svg.appendChild(line);}
  line.setAttribute('x1',r.right-b.left);line.setAttribute('y1',r.top+r.height/2-b.top);line.setAttribute('x2',x-b.left);line.setAttribute('y2',y-b.top);
}
document.addEventListener('pointermove',e=>{if(matchDrag)drawTempLine(e.clientX,e.clientY);});
document.addEventListener('pointerup',e=>{
  if(!matchDrag)return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.match-card[data-side="right"]');
  if(target&&$('matchBoard')?.contains(target)){connectMatch(matchDrag.id,target.dataset.id);return;}
  matchDrag=null;const q=current();if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));
});
function calc(q,a){
  if(q.type==='mcq')return a.choice===q.correct?10:0;
  if(q.type==='match'){
    const n=Object.keys(q.correct).length;
    const h=Object.entries(q.correct).filter(([k,v])=>a.matches?.[k]===v).length;
    return n?h/n*10:0;
  }
  return 0;
}
function answerText(q){
  if(q.type==='mcq')return q.options.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='match')return Object.entries(q.correct).map(([k,v])=>{
    const left=q.left.find(x=>x[0]===k),right=q.right.find(x=>x[0]===v);
    return (left?.[1]||k)+' → '+(right?.[1]||v);
  }).join('; ');
  return '';
}
function feedback(q){
  const p=calc(q,A(q));
  return `<div class="feedback ${p>=9.99?'':'wrong'}"><b>${p>=9.99?'Chính xác!':'Em đã hoàn thành lượt kiểm tra.'}</b> Điểm câu này: ${pointsText(p)}/10. ${p<9.99?'<br><b>Đáp án:</b> '+esc(answerText(q)):''}</div>`;
}
function checkAnswer(){
  let q=current(),a=A(q);if(a.checked)return;
  if(q.type==='mcq'&&!a.choice){alert('Em hãy chọn đáp án!');return;}
  if(q.type==='match'&&Object.keys(a.matches||{}).length===0){alert('Em hãy nối các cặp tương ứng!');return;}
  a.checked=true;playCheckSound(calc(q,a)>=9.99);state.selected=null;matchDrag=null;render();
}
function move(d){state.idx=Math.max(0,Math.min(state.order.length-1,state.idx+d));state.selected=null;matchDrag=null;render();}
function go(i){state.idx=i;state.selected=null;matchDrag=null;render();}
function submitGame(auto=false){
  if(!$('gameScreen').hidden&&!auto&&!confirm('Em có chắc chắn muốn nộp bài?'))return;
  clearInterval(state.timer);
  let total=0,full=0,part=0,wrong=0;
  QUESTIONS.forEach(q=>{
    const p=calc(q,A(q));total+=p;
    if(p>=9.99)full++;else if(p>0)part++;else wrong++;
  });
  $('gameScreen').hidden=true;$('resultScreen').hidden=false;
  $('resultBody').innerHTML=`<div class="result-score">${pointsText(total)} / ${TOTAL_POINTS} điểm</div>
    <p>Đúng hoàn toàn: <b>${full}</b> câu</p>
    <p>Đúng một phần: <b>${part}</b> câu</p>
    <p>Sai hoặc chưa hoàn thành: <b>${wrong}</b> câu</p>
    <p>Thời gian làm bài: <b>${formatTime(elapsedSeconds())}</b></p>
    <hr><h3>Xem lại câu hỏi và đáp án</h3>
    ${QUESTIONS.map(q=>{
      const p=calc(q,A(q));
      return `<div class="feedback ${p>=9.99?'':'wrong'}"><b>Câu ${q.id} – ${pointsText(p)}/10</b><br>${esc(q.prompt)}<br><b>Đáp án:</b> ${esc(answerText(q))}</div>`;
    }).join('')}
    <div class="action-row"><button class="btn primary" onclick="location.reload()">LÀM LẠI BÀI</button></div>`;
}
window.addEventListener('resize',()=>{
  const q=current();
  if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));
});
</script>
