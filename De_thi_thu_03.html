.image-option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch;margin:14px 0}

function dragGroup(e,id){if(A(current()).checked){e.preventDefault();return;}draggedGroup=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}
function dropGroupTo(e,gid){e.preventDefault();let q=current(),a=A(q),id=draggedGroup||state.selected;if(!id||a.checked)return;a.groups=a.groups||{};a.groups[id]=gid;draggedGroup=null;state.selected=null;render();}
function dropGroupToBank(e){e.preventDefault();let q=current(),a=A(q),id=draggedGroup||state.selected;if(!id||a.checked)return;if(a.groups)delete a.groups[id];draggedGroup=null;state.selected=null;render();}
function tapOrder(id){if(A(current()).checked)return;if(!state.selected){state.selected=id;render();return;}let q=current(),a=A(q),arr=a.order||q.items.map(x=>x[0]),i=arr.indexOf(state.selected),j=arr.indexOf(id);if(i>=0&&j>=0)[arr[i],arr[j]]=[arr[j],arr[i]];a.order=arr;state.selected=null;render();}
function dragOrder(e,id){dragged=id;e.dataTransfer.setData('text/plain',id);}
function dropOrder(e,id){e.preventDefault();let q=current(),a=A(q),arr=a.order||q.items.map(x=>x[0]),from=arr.indexOf(dragged),to=arr.indexOf(id);if(from>=0&&to>=0){arr.splice(to,0,arr.splice(from,1)[0]);a.order=arr;}dragged=null;render();}
function calc(q,a){
  if(q.type==='mcq'||q.type==='mcq-image')return a.choice===q.correct?10:0;
  if(q.type==='multi')return JSON.stringify([...(a.choice||[])].sort())===JSON.stringify([...q.correct].sort())?10:0;
  if(q.type==='fill')return (Array.isArray(q.correct)?q.correct:[q.correct]).some(x=>norm(x)===norm(a.value))?10:0;
  if(q.type==='select')return norm(q.correct)===norm(a.value)?10:0;
  if(q.type==='fields')return q.correct.reduce((sum,x,i)=>sum+(norm(x)===norm(a.fields?.[i])?10/q.correct.length:0),0);
  if(q.type==='match'){let n=Object.keys(q.correct).length,h=Object.entries(q.correct).filter(([k,v])=>a.matches?.[k]===v).length;return h/n*10;}
  if(q.type==='group'){const items=q.items||[];const n=items.length;if(!n)return 0;const h=items.filter(([id])=>Object.prototype.hasOwnProperty.call(q.correct,id)&&a.groups?.[id]===q.correct[id]).length;return Math.min(10,Math.max(0,h/n*10));}
  if(q.type==='order'){let arr=a.order||q.items.map(x=>x[0]);return q.correct.reduce((sum,x,i)=>sum+(arr[i]===x?10/q.correct.length:0),0);}
  return 0;
}
function feedback(q){let a=A(q),p=calc(q,a);return `<div class="feedback ${p>=9.99?'':'wrong'}"><b>${p>=9.99?'Chính xác!':'Em đã hoàn thành lượt kiểm tra.'}</b> Điểm câu này: ${p.toFixed(1).replace('.0','')}/10. ${q.explanation||''} ${p<9.99?'<br><b>Đáp án:</b> '+answerText(q):''}</div>`;}
function answerText(q){
  if(q.type==='mcq')return q.options.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='mcq-image')return q.imageOptions.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='multi')return q.correct.join(', ');
  if(q.type==='fill')return Array.isArray(q.correct)?q.correct[0]:q.correct;
  if(q.type==='select')return q.selectOptions.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='fields')return q.correct.join(' – ');
  if(q.type==='match')return Object.entries(q.correct).map(([k,v])=>q.left.find(x=>x[0]===k)[1]+' → '+q.right.find(x=>x[0]===v)[1]).join('; ');
  if(q.type==='group')return Object.entries(q.correct).map(([k,v])=>q.items.find(x=>x[0]===k)[1]+' → '+q.groups.find(x=>x[0]===v)[1]).join('; ');
  if(q.type==='order')return q.correct.map(id=>q.items.find(x=>x[0]===id)[1]).join(' ');
  return '';
}
function reviewPrompt(q){
  let html=q.prompt||'';
  if(q.media)html+=`<br><img class="q-media" src="${IMG[q.media]}" alt="Hình minh họa câu ${q.id}">`;
  if(q.inlinePrompt)html+=`<br>${q.inlinePrompt.replace(/\[\[\d+\]\]/g,'………')}`;
  return html;
}
function checkAnswer(){
  let q=current(),a=A(q);if(a.checked)return;
  if((q.type==='mcq'||q.type==='mcq-image')&&!a.choice){alert('Em hãy chọn đáp án!');return;}
  if(q.type==='multi'&&!a.choice?.length){alert('Em hãy chọn đáp án!');return;}
  if((q.type==='fill'||q.type==='select')&&!a.value?.trim()){alert(q.type==='select'?'Em hãy chọn đáp án!':'Em hãy điền đáp án vào chỗ trống!');return;}
  if(q.type==='fields'&&q.correct.some((_,i)=>!a.fields?.[i]?.trim())){alert('Em hãy điền đủ các chỗ trống!');return;}
  if(q.type==='match'&&Object.keys(a.matches||{}).length===0){alert('Em hãy nối các cặp tương ứng!');return;}
  if(q.type==='group'&&Object.keys(a.groups||{}).length===0){alert('Em hãy xếp các từ vào nhóm!');return;}
  a.checked=true;state.selected=null;render();
}
function move(d){state.idx=Math.max(0,Math.min(29,state.idx+d));state.selected=null;matchDrag=null;render();}
function go(i){state.idx=i;state.selected=null;matchDrag=null;render();}
function submitGame(auto=false){
  if(!$('gameScreen').hidden&&!auto&&!confirm('Em có chắc chắn muốn nộp bài?'))return;
  clearInterval(state.timer);let total=0,full=0,part=0,wrong=0;
  QUESTIONS.forEach(q=>{let p=calc(q,A(q));total+=p;if(p>=9.99)full++;else if(p>0)part++;else wrong++;});
  $('gameScreen').hidden=true;$('resultScreen').hidden=false;
  $('resultBody').innerHTML=`<div class="result-score">${total.toFixed(1).replace('.0','')} / 300 điểm</div><h3>${esc(state.name)}</h3><p>Đúng hoàn toàn: <b>${full}</b> câu</p><p>Đúng một phần: <b>${part}</b> câu</p><p>Sai hoặc chưa hoàn thành: <b>${wrong}</b> câu</p><p>Thời gian làm bài: ${$('timer').textContent}</p><hr><h3>Xem lại đáp án</h3>${QUESTIONS.map(q=>`<div class="feedback ${calc(q,A(q))>=9.99?'':'wrong'}"><b>Câu ${q.id} – ${calc(q,A(q)).toFixed(1).replace('.0','')}/10</b><br>${reviewPrompt(q)}<br><b>Đáp án:</b> ${answerText(q)}</div>`).join('')}<div class="action-row"><button class="btn primary" onclick="location.reload()">LÀM LẠI BÀI</button></div>`;
}
$('questionContent').addEventListener('click',e=>{
  const zone=e.target.closest('.dropzone');if(zone){placeGroup(zone.dataset.gid);return;}
});
window.addEventListener('resize',()=>{let q=current();if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));});
</script></body></html>
